<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小房仲Jason</title>
        <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background: #fbf9f8;
            color: #333;
        }

        /* 導覽列 */
        header {
            background: #17365d;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 38px;
        }

        /* 小房仲 Jason 標題連結 */
        .logo-area h1 {
            margin: 0;
        }

        .brand-link {
            color: white;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .brand-link:hover,
        .brand-link:focus,
        .brand-link:active {
            color: #ffc857;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover {
            color: #ffc857;
        }

        /* 首頁主視覺 */
        .hero {
            background: linear-gradient(
                rgba(0,0,0,0.45),
                rgba(0,0,0,0.45)
            ), url("https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1600")
            center/cover;

            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }

        .hero h2 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
        }

        /* 搜尋區 */
        .search {
            background: white;
            padding: 25px;
            margin: -40px auto 40px;
            max-width: 1100px;
            position: relative;
            border-radius: 10px;
            box-shadow: 0 3px 15px #ccc;
        }

        .search h2 {
            margin-bottom: 15px;
        }

        .search-box {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        select, input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            flex: 1;
            min-width: 150px;
        }

        button {
            padding: 12px 25px;
            border: none;
            background: #17365d;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #286090;
        }

        /* 房屋物件 */
        .container {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        .container h2 {
            margin-bottom: 25px;
        }

        .house-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .house {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px #ddd;
        }

        .house img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .house-info {
            padding: 18px;
        }

        .house-info h3 {
            margin-bottom: 10px;
        }

        .price {
            color: #d9534f;
            font-size: 23px;
            font-weight: bold;
            margin: 12px 0;
        }

        .house-info p {
            margin: 8px 0;
            color: #666;
        }

        .detail-btn {
            width: 100%;
            margin-top: 12px;
        }

        /* 聯絡我們 */
        .contact {
            background: #17365d;
            color: white;
            padding: 40px 20px;
            text-align: center;
            margin-top: 50px;
        }

        .contact input,
        .contact textarea {
            display: block;
            width: 100%;
            max-width: 450px;
            margin: 12px auto;
            padding: 12px;
            border-radius: 5px;
            border: none;
        }

        .contact textarea {
            min-height: 100px;
        }

        footer {
            background: #10243d;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* 手機版 */
        @media(max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 5px;
                display: inline-block;
            }

            .hero h2 {
                font-size: 27px;
            }

            .house-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<!-- 導覽列 -->
<header>

     <nav>
        <h1>
        <a href="#home">首頁</a>
        <a href="#houses">房屋物件</a>
        <a href="#contact">聯絡我們</a>
        </h1>
    </nav>
   
     <div class="logo-area">
        <img src="Jason-logo.png" alt="小房仲 Jason Logo">
        <h1><a class="brand-link" href="sleepindex.html">🏠小房仲 Jason</a></h1>
    </div>
       
   

   
</header>

<!-- 首頁 -->
<section class="hero" id="home">
    <div>
        <h2>找到理想的家，從幸福開始</h2>
        <p>專業房仲服務，買屋、賣屋、租屋一次完成</p>
    </div>
</section>

<!-- 搜尋 -->
<section class="search">
    <h2>🔍 房屋搜尋</h2>

    <div class="search-box">

        <select id="city">
            <option value="">全部地區</option>
            <option value="桃園">桃園</option>
            <option value="台北">台北</option>
            <option value="新竹">新竹</option>
        </select>

        <select id="type">
            <option value="">全部類型</option>
            <option value="大樓">大樓</option>
            <option value="公寓">公寓</option>
            <option value="透天">透天</option>
        </select>

        <select id="price">
            <option value="">全部價格</option>
            <option value="1000">1000萬以下</option>
            <option value="2000">2000萬以下</option>
            <option value="3000">3000萬以下</option>
        </select>

        <button onclick="searchHouse()">搜尋物件</button>

    </div>
</section>

<!-- 房屋列表 -->
<section class="container" id="houses">

    <h2>🏡 精選房屋物件</h2>

    <div class="house-list" id="houseList">

        <article class="house"
            data-city="桃園"
            data-type="大樓"
            data-price="1580">

            <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=800"
                 alt="現代住宅">

            <div class="house-info">
                <h3>桃園精美景觀大樓</h3>
                <p>📍 桃園市中壢區</p>
                <p>房屋類型：大樓</p>
                <p>坪數：38坪</p>
                <div class="price">1,580 萬</div>
                <button class="detail-btn"
                    onclick="showDetail('桃園精美景觀大樓','桃園市中壢區','大樓','38坪','1,580萬')">
                    查看詳情
                </button>
            </div>
        </article>

        <article class="house"
            data-city="台北"
            data-type="公寓"
            data-price="980">

            <img src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=800"
                 alt="現代公寓">

            <div class="house-info">
                <h3>台北市溫馨公寓</h3>
                <p>📍 台北市內湖區</p>
                <p>房屋類型：公寓</p>
                <p>坪數：28坪</p>
                <div class="price">980 萬</div>
                <button class="detail-btn"
                    onclick="showDetail('台北市溫馨公寓','台北市內湖區','公寓','28坪','980萬')">
                    查看詳情
                </button>
            </div>
        </article>

        <article class="house"
            data-city="新竹"
            data-type="透天"
            data-price="2680">

            <img src="https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?w=800"
                 alt="現代透天住宅">

            <div class="house-info">
                <h3>新竹豪華透天別墅</h3>
                <p>📍 新竹市東區</p>
                <p>房屋類型：透天</p>
                <p>坪數：65坪</p>
                <div class="price">2,680 萬</div>
                <button class="detail-btn"
                    onclick="showDetail('新竹豪華透天別墅','新竹市東區','透天','65坪','2,680萬')">
                    查看詳情
                </button>
            </div>
        </article>

    </div>
</section>

<!-- 聯絡我們 -->
<section class="contact" id="contact">

    <h2>📞 聯絡我們</h2>
    <p>有任何房屋買賣問題，歡迎與我們聯繫</p>

    <form onsubmit="sendMessage(event)">

        <input type="text" id="name"
            placeholder="請輸入姓名" required>

        <input type="email" id="email"
            placeholder="請輸入電子郵件" required>

        <textarea id="message"
            placeholder="請輸入您的需求" required></textarea>

        <button type="submit">送出訊息</button>

    </form>

</section>

<footer>
    <p>© 小房仲Jason</p>
    <p>電話：03-12345678</p>
</footer>

<script>

// 房屋搜尋
function searchHouse() {

    let city = document.getElementById("city").value;
    let type = document.getElementById("type").value;
    let price = document.getElementById("price").value;

    let houses = document.querySelectorAll(".house");

    let count = 0;

    houses.forEach(function(house) {

        let hCity = house.dataset.city;
        let hType = house.dataset.type;
        let hPrice = Number(house.dataset.price);

        let show = true;

        if(city && city !== hCity) {
            show = false;
        }

        if(type && type !== hType) {
            show = false;
        }

        if(price && hPrice > Number(price)) {
            show = false;
        }

        house.style.display = show ? "block" : "none";

        if(show) count++;

    });

    if(count === 0) {
        alert("沒有符合條件的房屋！");
    }
}

// 查看房屋詳細資訊
function showDetail(name, address, type, area, price) {

    alert(
        "房屋名稱：" + name +
        "\n地址：" + address +
        "\n類型：" + type +
        "\n坪數：" + area +
        "\n價格：" + price
    );

}

// 聯絡表單
function sendMessage(event) {

    event.preventDefault();

    let name = document.getElementById("name").value;

    alert("感謝 " + name + "！您的訊息已完成表單示範。");

    document.querySelector(".contact form").reset();

}

</script>

</body>
</html>
