

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小房仲Jason休息中</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    font-family: "Microsoft JhengHei", Arial, sans-serif;
    color: #58758a;
    background: linear-gradient(#eaf8ff, #fff 68%, #f2faee);
}
header { text-align: center; padding: 26px 14px 0; }
h1 { margin: 0; font-size: clamp(25px, 5vw, 38px); color: #5c91ad; }
.subtitle { margin: 9px 0 0; color: #87a9b8; }
.scene {
    position: relative;
    width: min(900px, 100%);
    min-height: min(78vw, 700px);
    margin: 0 auto;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 4px 8px 0;
}
.swing {
    width: min(100%, 760px);
    transform-origin: 50% 5%;
    animation: gentleSwing 4.2s ease-in-out infinite alternate;
    will-change: transform;
}
.swing img {
    display: block;
    width: 100%;
    height: auto;
}
.sparkle {
    position: absolute;
    color: #e7c76c;
    font-size: 25px;
    animation: twinkle 2.4s ease-in-out infinite alternate;
}
.s1 { left: 9%; top: 35%; }
.s2 { right: 10%; top: 26%; animation-delay: .8s; }
.s3 { right: 17%; top: 61%; animation-delay: 1.2s; }
.caption { text-align: center; padding: 0 12px 16px; color: #86a18a; }
.back-home-wrap {
    text-align: center;
    padding: 0 12px 36px;
}
.back-home-btn {
    display: inline-block;
    padding: 10px 26px;
    background-color: #ffffff;
    color: #5c91ad;
    text-decoration: none;
    font-size: 15px;
    font-weight: bold;
    border: 1.5px solid #b8d8e8;
    border-radius: 999px;
    box-shadow: 0 4px 12px rgba(92, 145, 173, 0.12);
    transition: all 0.25s ease;
}
.back-home-btn:hover {
    background-color: #5c91ad;
    color: #ffffff;
    border-color: #5c91ad;
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(92, 145, 173, 0.22);
}
@keyframes gentleSwing {
    from { transform: rotate(-4deg); }
    to   { transform: rotate(4deg); }
}
@keyframes twinkle {
    from { opacity: .35; transform: scale(.8); }
    to   { opacity: 1; transform: scale(1.15); }
}
@media (prefers-reduced-motion: reduce) {
    .swing, .sparkle { animation: none; }
}
@media (max-width: 520px) {
    .scene { min-height: 100vw; padding: 8px 0 0; }
    .swing { width: 100%; }
    .sparkle { font-size: 18px; }
}
</style>
</head>
<body>
<header>
    <h1>🌙 小房仲Jason休息中</h1>
    <p class="subtitle">這個世界上沒有睡一覺不能解決的事情,如果有,等睡醒再說♡♡♡</p>
</header>

<main class="scene">
    <span class="sparkle s1">✦</span>
    <span class="sparkle s2">✧</span>
    <span class="sparkle s3">✦</span>
    <div class="swing">
        <img src="hammock_baby.jpg" alt="睡在藍色網狀吊床裡的寶寶">
    </div>
</main>

<p class="caption">☁️ 願每個夢都溫柔又甜蜜 ☁️</p>

<div class="back-home-wrap">
    <a href="index.html" class="back-home-btn">🏠 回到首頁</a>
</div>
</body>
</html>
